[project]
name = "kliprix-backend"
version = "0.1.0"
description = "Kliprix local backend (FastAPI)"
requires-python = ">=3.11,<3.13"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests"]

# yt-dlp ships no type hints (no py.typed); its objects are typed as Any at our boundary.
[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

# faster-whisper, MediaPipe, fontTools, sherpa-onnx, onnxruntime and tokenizers ship no type hints either.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "mediapipe", "mediapipe.*", "fontTools", "fontTools.*", "sherpa_onnx", "sherpa_onnx.*", "onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
